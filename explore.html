*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-g)}

/* 导航（与 v3.1 同步） */

.nav__in{max-width:1180px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:max-content}
.brand__logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff}
.brand__t{font-size:15px;font-weight:700;color:var(--bright);letter-spacing:.2px}
.brand__s{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.nav__links{display:flex;gap:6px;margin-left:auto}
.nav__link{padding:7px 14px;border-radius:8px;font-size:13px;color:var(--dim);transition:all var(--tr);font-weight:500}
.nav__link:hover{background:var(--hover);color:var(--text)}
.nav__link--active{background:var(--accent-l);color:var(--accent)}

.container{max-width:1180px;margin:0 auto;padding:30px 22px 80px}

.explore-hero__subtitle{font-size:14.5px;color:var(--dim);max-width:680px;margin:0 auto 18px;line-height:1.7}
.hero-stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.hero-stat{font-size:12px;color:var(--muted)}
.hero-stat b{color:var(--bright);font-weight:700;font-size:15px;font-family:var(--mono);margin-right:4px}

.explore-section__label{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-l);padding:2px 10px;border-radius:6px;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}

.explore-section__desc{font-size:13.5px;color:var(--dim);margin-bottom:18px;line-height:1.6}

.playlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

.playlist-card{
  display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);

.playlist-card:hover{background:var(--hover);border-color:var(--card-color,var(--accent));transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}

.playlist-card__title{font-size:15.5px;font-weight:700;color:var(--bright);margin-bottom:6px;line-height:1.4}
.playlist-card__desc{font-size:12.5px;color:var(--dim);line-height:1.55;margin-bottom:12px;min-height:55px}
.playlist-card__meta{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--border)}
.playlist-card__count{font-size:12px;color:var(--muted);font-family:var(--mono)}
.playlist-card__count b{color:var(--bright);font-weight:700;margin-right:3px}
.playlist-card__cta{font-size:12px;font-weight:600;color:var(--card-color,var(--accent))}
.playlist-card__cta::after{content:' →'}

.section--role .playlist-card{--card-color:#a78bfa}

      </section>`;
  });
  container.innerHTML = html;
}

// 5. 渲染 playlist card
function renderCard(p){
  const color = p.color || '#4c8bf5';
  const cnt = (p.problemIds || []).length;
  // 跳转主页面：把 playlist id 存到 localStorage，主页面读它预填
  return `
    <a class="playlist-card" href="#" style="--card-color:${color}" onclick="openPlaylist('${p.id}');return false;">
      <div class="playlist-card__icon">${(p.icon||'📌').substring(0,2)}</div>
      <div class="playlist-card__title">${esc(p.title)}</div>
      <div class="playlist-card__desc">${esc(p.desc)}</div>
      <div class="playlist-card__meta">
        <span class="playlist-card__count"><b>${cnt}</b> Problems</span>
        <span class="playlist-card__cta">开始刷</span>
      </div>
    </a>`;
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 6. 跳转到主页面，应用 playlist 筛选
function openPlaylist(id){
  // 所有 playlists 数据
  const all = Object.values(PLAYLISTS_DATA).flat();
  const pl = all.find(p => p.id === id);
  if (!pl) return;
  // 把 playlist id 和 problemIds 存到 localStorage，主页面读它
  try {
    localStorage.setItem('qib-active-playlist', JSON.stringify({
      id: pl.id,
      title: pl.title,
      problemIds: pl.problemIds || []
    }));
  } catch (e) {}
  // 跳到主页面
  window.location.href = 'index.html';
}

renderSections();
</script>
